<style>
  /* ==========================================================
     Jetons repris tels quels de accueil.html — mêmes couleurs,
     même vallée nocturne, pour que la porte d'entrée et le site
     ne se contredisent pas d'un clic à l'autre.
     ========================================================== */
  :root{
    color-scheme:dark;
    --text:#F3EFE4;
    --muted:#A3ADBB;
    --gold:#D9B872;
    --gold-soft:#B89858;
    --gold-line-2:rgba(217,184,114,.45);
    --gold-tint:rgba(217,184,114,.06);
    --speck:rgba(217,184,114,.30);
    --page-solid:#090D13;
    --veil:linear-gradient(165deg, rgba(7,10,15,.90) 0%, rgba(11,16,24,.86) 45%, rgba(7,10,15,.92) 100%);
    --vignette:radial-gradient(ellipse 122% 94% at 50% 44%, transparent 44%, rgba(0,0,0,.30) 100%);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--page-solid);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--gold);color:var(--page-solid);}

  /* poussière dorée — reprise de accueil.html */
  body::before{
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 12% 22%, var(--speck), transparent),
      radial-gradient(1px 1px at 82% 14%, var(--speck), transparent),
      radial-gradient(1px 1px at 64% 62%, var(--speck), transparent),
      radial-gradient(1px 1px at 30% 78%, var(--speck), transparent),
      radial-gradient(1px 1px at 90% 70%, var(--speck), transparent);
  }

  /* ===== LA VALLÉE — même fond que accueil.html =====
     Voir accueil.html pour le détail : relief en huit plans, aurore,
     étoiles, lucioles, teinte qui suit l'heure réelle. Ici la scène
     n'a pas de contenu à faire défiler : pas de voile qui s'épaissit
     au scroll, une valeur fixe suffit. */
  .bg-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(ellipse 60% 50% at 55% 63%, #262e52, transparent),
      linear-gradient(180deg,#070d21 0%,#1c2442 60%,#050a15 100%);
    opacity:0;transition:opacity 1.6s ease;}
  .bg-scene.pret{opacity:1;}
  .sans-js .bg-scene{opacity:1;}

  .bg-valley{position:absolute;inset:0;}
  .bg-valley canvas{width:100%;height:100%;display:block;opacity:0;transition:opacity 2.4s;}
  .bg-valley.ready canvas{opacity:1;}
  .bg-fallback{position:absolute;inset:0;width:100%;height:100%;}
  .bg-valley.ready .bg-fallback{opacity:0;transition:opacity 2.6s;}

  .bg-veil{position:absolute;inset:0;background:var(--veil);opacity:.32;}
  .bg-vignette{position:absolute;inset:0;background:var(--vignette);}

  @media(prefers-reduced-motion:reduce){
    .bg-scene{transition:none;}
    .bg-veil{opacity:.55;}
  }

  /* ===== LA PORTE ===== */
  .gate{position:relative;z-index:1;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:48px 24px 90px;}

  .gate-crest{width:min(34vw,230px);height:auto;
    filter:drop-shadow(0 20px 46px rgba(0,0,0,.6));margin-bottom:6px;}

  .gate-eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold-soft);margin-bottom:24px;}

  .gate-word{font-family:'Fraunces',serif;font-weight:600;
    font-size:clamp(42px,7.4vw,84px);letter-spacing:-.01em;line-height:1.04;
    margin-bottom:22px;text-shadow:0 3px 44px rgba(0,0,0,.55);text-wrap:balance;}
  .gate-word em{font-style:italic;color:var(--gold);}

  .gate-tag{font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--muted);margin-bottom:42px;}

  .gate-enter{display:inline-flex;align-items:center;gap:16px;
    border:1px solid var(--gold-line-2);color:var(--gold);background:var(--gold-tint);
    padding:16px 32px;border-radius:2px;font-size:12px;font-weight:600;
    letter-spacing:.2em;text-transform:uppercase;text-decoration:none;
    backdrop-filter:blur(6px);transition:background .2s,border-color .2s;}
  .gate-enter:hover{background:rgba(217,184,114,.18);border-color:var(--gold);}
  .gate-enter:focus-visible{outline:2px solid var(--gold);outline-offset:5px;}
  .gate-enter span{font-size:15px;line-height:1;}

  .gate-footer{position:fixed;left:0;right:0;bottom:0;z-index:1;
    text-align:center;padding:24px;font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted);pointer-events:none;}

  @media(max-width:560px){
    .gate-crest{width:min(46vw,180px);}
    .gate-footer{font-size:8.5px;padding:18px;}
  }

  @media(prefers-reduced-motion:reduce){
    .gate-enter{transition:none;}
  }
</style>
</head>
<body>

<noscript><style>.bg-scene{opacity:1 !important;}</style></noscript>
<div class="bg-scene" id="bgScene" aria-hidden="true">
  <div class="bg-valley" id="bgValley">

      <path fill="#2A3E52" d="M0,300 L0,150 L52,124 L96,140 L150,76 L196,108 L238,90 L296,26 L332,64 L370,48 L414,90 L462,68 L516,108 L560,88 L606,118 L652,58 L690,96 L736,76 L788,120 L840,100 L892,132 L944,110 L998,136 L1056,116 L1112,142 L1200,126 L1200,300 Z"/>
      <path fill="#284038" d="M0,300 L0,196 L70,180 L128,194 L186,154 L240,178 L292,148 L350,170 L408,124 L452,146 L508,96 L548,68 L592,112 L642,146 L700,126 L756,158 L812,140 L870,166 L930,150 L988,176 L1050,160 L1112,182 L1200,170 L1200,300 Z"/>
      <path fill="#1A2C24" d="M0,300 L0,238 C110,228 190,212 300,204 C410,196 470,188 540,182 L580,178 L624,190 C700,208 770,222 850,228 C930,234 1010,230 1100,224 C1150,220 1180,224 1200,228 L1200,300 Z"/>
      <path fill="#0E1714" d="M0,300 L0,272 C140,262 250,270 370,264 C490,258 560,250 660,254 C780,258 880,268 990,266 C1090,264 1150,270 1200,274 L1200,300 Z"/>
    </svg>
  </div>
  <div class="bg-veil"></div>
  <div class="bg-vignette"></div>
</div>

<main class="gate">
  <img class="gate-crest" src="vigneron.png" alt="Marlowe Vineyard" width="230" height="230">
  <div class="gate-eyebrow">FlashbackFA · Tongva Hills, San Andreas</div>
  <h1 class="gate-word">Marlowe <em>Vineyard</em></h1>
  <div class="gate-tag">Vigne · Chai · Livraison</div>
  <a class="gate-enter" href="accueil.html"><span>✦</span> Entrer <span>↗</span></a>
</main>

<footer class="gate-footer">Espace membre · Domaine viticole sur FlashbackFA</footer>

<script src="three.min.js"></script>
<script>
(function(){
  const scene = document.getElementById('bgScene');
  if(scene) scene.classList.add('pret');
})();

/* ==================================================================
   LA VALLÉE — fond nocturne en shader Three.js
   ------------------------------------------------------------------
   Identique à celui de accueil.html (même shader, même teinte qui suit
   l'heure) : voir ce fichier pour le détail commenté. Dupliqué plutôt
   que partagé dans un troisième script, pour que cette page reste
   indépendante et légère — elle n'a besoin de rien d'autre.
   ================================================================== */
(function(){
  const hote = document.getElementById('bgValley');
  if(!hote || typeof THREE === 'undefined') return;

  const fragment = `
precision highp float;
uniform vec2 uResolution;uniform vec2 uMouse;uniform float uTime;uniform float uScroll;uniform float uWave;uniform float uParticles;uniform vec3 uTint;
varying vec2 vUv;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.;float a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(13.1,7.3);a*=.5;}return v;}
void main(){
vec2 uv=vUv;float aspect=uResolution.x/uResolution.y;vec2 p=vec2((uv.x-.5)*aspect,uv.y);p+=uMouse*.012;
vec3 col=mix(vec3(.105,.139,.235),vec3(.016,.024,.065),smoothstep(.25,1.,p.y));
float aura=exp(-pow((p.x-.2)*.85,2.)-pow((p.y-.58)*4.,2.));col+=vec3(.05,.035,.095)*aura;
float ay=.79+.06*sin(p.x*2.1+uTime*.035)+.035*sin(p.x*4.3-uTime*.021);
float curtain=exp(-abs(p.y-ay)*22.)*(.5+.5*noise(vec2(p.x*5.+uTime*.015,p.y*2.)));
col+=vec3(.075,.057,.145)*curtain*(.35+.65*smoothstep(-.9,.8,p.x));
vec2 stars=p*vec2(220.,140.);vec2 cell=floor(stars);vec2 sf=fract(stars)-.5;float rnd=hash(cell);float star=exp(-dot(sf,sf)*180.)*step(.992,rnd)*smoothstep(.47,.8,p.y);col+=vec3(.56,.61,.75)*star*(.55+.25*sin(uTime*.3+rnd*80.));
for(int i=0;i<8;i++){float d=float(i);float x=p.x+uMouse.x*d*.009;float depth=d/7.;
x*=1.-uScroll*.035*depth;
float valley=pow(min(abs(x+.055),1.8),.85);
float ridge=.345-d*.039+valley*(.16+d*.033)+(fbm(vec2(x*(2.1+d*.24)+d*9.7,d*5.13))-.48)*(.20+d*.022);
ridge+=uMouse.y*depth*.025+uScroll*depth*.07;
float below=ridge-p.y;float mask=smoothstep(-.0018,.0018,below);
vec3 mountain=mix(vec3(.12,.16,.265),vec3(.012,.026,.047),depth);
float face=fbm(vec2(x*6.+d*12.,p.y*7.+d*3.));mountain+=vec3(.014,.02,.035)*(face-.4);
mountain+=vec3(.019,.027,.05)*exp(-max(below,0.)*11.);
float sweep=exp(-pow((x-(uWave*3.8-1.9)-d*.065)*5.,2.))*step(0.,uWave)*step(uWave,1.);
float edge=exp(-abs(below)*250.);mountain+=vec3(.70,.47,.18)*edge*sweep*.85;mountain+=vec3(.09,.055,.017)*sweep*exp(-abs(below)*22.);
col=mix(col,mountain,mask);
float mist=exp(-pow((p.y-ridge+.025)*30.,2.))*(.2+.8*fbm(vec2(x*3.+uTime*.023+d*4.,p.y*9.-uTime*.009)));
col+=vec3(.058,.072,.104)*mist*(1.-depth*.6);
}
for(int i=0;i<70;i++){float id=float(i);if(id>=uParticles)break;float r=hash(vec2(id,6.));float r2=hash(vec2(id,19.));vec2 pos=vec2((r-.5)*aspect*1.2,.055+r2*.50);pos.x+=sin(uTime*(.055+r2*.035)+id*3.)*.025+uMouse.x*r2*.03;pos.y+=sin(uTime*.12+id*4.)*.018;vec2 delta=p-pos;float size=mix(.0008,.0021,hash(vec2(id,2.)));float dist=length(delta);float glow=exp(-dist*dist/(size*size))*1.1+exp(-dist*dist/(size*size*30.))*.12;float flicker=pow(.5+.5*sin(uTime*(.35+r*.3)+id*7.),2.);col+=vec3(.95,.66,.28)*glow*(.2+.8*flicker);}
float vignette=1.-.32*pow(length((uv-.5)*vec2(1.,.8)),1.3);col*=vignette;col*=uTint;col+=(hash(gl_FragCoord.xy)-.5)/255.;gl_FragColor=vec4(col,1.);
}`;

  let renderer;
  try { renderer = new THREE.WebGLRenderer({ alpha:false, antialias:false, powerPreference:'low-power' }); }
  catch(e){ return; }

  const mobile = matchMedia('(max-width: 700px)').matches;
  let ratio = Math.min(devicePixelRatio, mobile ? 1.15 : 1.65);
  renderer.setPixelRatio(ratio);
  hote.appendChild(renderer.domElement);

  const TEINTES = [
    { h:0,   c:[1.00,1.00,1.08] },
    { h:3,   c:[0.94,0.96,1.12] },
    { h:6,   c:[1.05,0.95,1.02] },
    { h:7.5, c:[1.28,1.02,0.90] },
    { h:10,  c:[1.12,1.10,1.15] },
    { h:13,  c:[1.05,1.12,1.28] },
    { h:16,  c:[1.15,1.08,1.05] },
    { h:18,  c:[1.35,1.05,0.85] },
    { h:20,  c:[1.20,0.85,0.95] },
    { h:22,  c:[1.02,0.92,1.05] },
    { h:24,  c:[1.00,1.00,1.08] },
  ];
  function teinteHeure(){
    const d = new Date();
    const h = d.getHours() + d.getMinutes() / 60;
    for (let i = 0; i < TEINTES.length - 1; i++){
      const p = TEINTES[i], q = TEINTES[i+1];
      if (h >= p.h && h <= q.h){
        const t = (h - p.h) / (q.h - p.h);
        return [0,1,2].map(k => p.c[k] + (q.c[k] - p.c[k]) * t);
      }
    }
    return TEINTES[0].c.slice();
  }

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const teinteDepart = teinteHeure();
  const uniforms = {
    uResolution:{ value: new THREE.Vector2() },
    uMouse:{ value: new THREE.Vector2() },
    uTime:{ value: 0 },
    uScroll:{ value: 0 },
    uWave:{ value: -1 },
    uParticles:{ value: mobile ? 26 : 64 },
    uTint:{ value: new THREE.Color(teinteDepart[0], teinteDepart[1], teinteDepart[2]) }
  };
  const cibleTeinte = new THREE.Color(teinteDepart[0], teinteDepart[1], teinteDepart[2]);
  const material = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader: fragment,
    depthTest:false, depthWrite:false
  });
  const geometry = new THREE.PlaneGeometry(2,2);
  scene.add(new THREE.Mesh(geometry, material));

  let raf = 0, last = performance.now(), time = 0, waveStart = -100, nextWave = 14, frames = 0, cost = 0;
  const target = new THREE.Vector2();
  let scroll = 0, lost = false;
  const paused = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render(){ renderer.render(scene, camera); }
  function resize(){ renderer.setSize(innerWidth, innerHeight); uniforms.uResolution.value.set(innerWidth, innerHeight); render(); }
  function pointer(e){ target.set(e.clientX/innerWidth-.5, .5-e.clientY/innerHeight); }
  function onScroll(){ scroll = Math.min(1, scrollY/Math.max(1, innerHeight)); }
  function tick(now){
    raf = 0;
    if (document.hidden || lost || paused) return;
    const dt = Math.min((now-last)/1000, .05); last = now;
    time += dt; uniforms.uTime.value = time;
    uniforms.uMouse.value.lerp(target, 1-Math.exp(-dt*2.2));
    uniforms.uScroll.value += (scroll - uniforms.uScroll.value) * (1-Math.exp(-dt*1.7));
    uniforms.uTint.value.lerp(cibleTeinte, 1-Math.exp(-dt*.5));
    if (time > nextWave){ waveStart = time; nextWave = time+28; }
    uniforms.uWave.value = time-waveStart < 6.5 ? (time-waveStart)/6.5 : -1;
    render();
    frames++; cost += dt;
    if (frames === 180){
      if (cost/frames > .026 && ratio > .85){
        ratio = Math.max(.85, ratio*.8);
        renderer.setPixelRatio(ratio);
        uniforms.uParticles.value = mobile ? 18 : 40;
        resize();
      }
      frames = 0; cost = 0;
    }
    raf = requestAnimationFrame(tick);
  }
  function resume(){ if (!document.hidden && !lost && !paused && !raf){ last = performance.now(); raf = requestAnimationFrame(tick); } }
  function visibility(){ if (document.hidden){ cancelAnimationFrame(raf); raf = 0; } else resume(); }
  function contextLost(e){ e.preventDefault(); lost = true; cancelAnimationFrame(raf); raf = 0; hote.classList.remove('ready'); }
  function restored(){ lost = false; resize(); hote.classList.add('ready'); resume(); }

  addEventListener('resize', resize);
  addEventListener('pointermove', pointer, { passive:true });
  addEventListener('scroll', onScroll, { passive:true });
  document.addEventListener('visibilitychange', visibility);
  renderer.domElement.addEventListener('webglcontextlost', contextLost);
  renderer.domElement.addEventListener('webglcontextrestored', restored);
  resize(); onScroll(); hote.classList.add('ready');
  if (paused) render(); else resume();

  setInterval(() => {
    const c = teinteHeure();
    cibleTeinte.setRGB(c[0], c[1], c[2]);
    if (paused){ uniforms.uTint.value.copy(cibleTeinte); render(); }
  }, 600000);
})();
</script>
</body>
</html>
