name = "marlowe-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# ---------------------------------------------------------------------------
# Variables NON sensibles — modifiables ici, elles peuvent rester publiques.
# ---------------------------------------------------------------------------
[vars]
# Identifiant du serveur Discord du domaine (clic droit sur le serveur ▸
# « Copier l'identifiant », mode développeur activé).
DISCORD_GUILD_ID = "932301610128912414"

# Adresse publique du site, SANS slash final.
SITE_URL = "https://poulpizar01.github.io/Marlowe-Vineyard"

# Rôles Discord qui donnent les pleins pouvoirs, séparés par des virgules.
PATRON_ROLES = "Patron,Co-Patron"

# Identifiants Discord ayant toujours tous les accès (le développeur).
# Séparés par des virgules. Laisser vide s'il n'y en a pas.
# 826526979204841482 = Thomas, développeur du site.
OWNER_IDS = "826526979204841482,186397473374208000"

# Catégories Discord où vivent les tickets, séparées par des virgules.
# Le Worker y cherche le salon d'une personne pour lui rappeler son permis :
# il retient celui où l'identifiant Discord de l'employé a une permission
# posée à son nom. Clic droit sur la catégorie ▸ « Copier l'identifiant ».
DISCORD_TICKET_CATEGORIES = "1489223949790216303,1489222452495122484,1490079726038024222,1489223226931417208,1490802701846577202"

# Salon Discord où le webhook du serveur de jeu écrit les ventes.
# Le Worker le relit tout seul toutes les deux minutes (voir [triggers] plus
# bas) et en tire les quotas. Le bot du VPS n'intervient pas.
#
# ATTENTION, une case à cocher indispensable : dans le portail développeur,
# onglet Bot, activez « Message Content Intent ». Elle vaut AUSSI pour les
# lectures REST : sans elle, Discord renvoie des embeds vides, sans erreur —
# le panel afficherait donc zéro vente en croyant que personne n'a produit.
DISCORD_LOGS_CHANNEL = "1219050214086676591"

# Le nom du métier à retenir dans les logs (champ jobName). Les autres
# entreprises qui écriraient dans le même salon sont ignorées.
DISCORD_LOGS_JOB = "Vigneron"

# Salon Discord des runners : identifiant du rôle à mentionner.
# L'adresse du webhook, elle, est un SECRET : voir README.
DISCORD_RUNNER_ROLE = "1112654936749125632"

# Le rôle réveillé par le bouton « Je suis disponible » — les membres du
# domaine, pas les runners. C'est l'inverse du retrait : un responsable
# annonce sa présence, et ceux qui viennent récupèrent ce qui leur revient.
# Si cette valeur manque ou n'est pas un identifiant, l'annonce part quand
# même, mais sans mention, et le panel le dit au lieu de laisser croire que
# tout le monde a été prévenu.
DISCORD_DISPO_ROLE = "1112658686431723520"

# Le salon où arrivent les rappels d'agenda, trois heures avant chaque
# événement commercial. C'est le BOT qui écrit — celui qui poste déjà les
# rappels de permis — et non un webhook : un identifiant de salon n'est pas
# un secret, il peut rester ici. Il faut en revanche que le bot ait le droit
# d'écrire dans ce salon.
# Laisser vide = aucun rappel n'est envoyé, et rien ne casse.
DISCORD_AGENDA_CHANNEL = "1509337025663471676"

# Les rôles réveillés par ce rappel, séparés par des virgules.
# Laisser vide : le rappel part quand même, mais sans mention — personne
# n'est prévenu, et /api/version le dit (rolesAgenda: 0).
DISCORD_AGENDA_ROLES = "943582598641381484,943583588581003365,1360832465211490317,1496532772326604881"

# Le salon où arrive une absence déclarée depuis l'espace personnel. Le bot y
# écrit une ligne : qui, quelles dates, quel motif. Personne n'est mentionné —
# c'est une information, pas une alerte.
# Laisser vide = l'absence est quand même enregistrée au registre, mais rien
# n'est annoncé, et le panel le dit au lieu de laisser croire au succès.
DISCORD_ABSENCE_CHANNEL = "1489652680765866125"

# ---------------------------------------------------------------------------
# Stockage principal : D1 (base SQLite).
#
# Tout ce que le panel enregistre vit ici — fiches RH, bilans, stock, réglages,
# sessions, présence. D1 autorise 100 000 écritures par jour sur le plan
# gratuit, contre 1 000 pour KV : c'est la raison de ce déménagement.
#
# À faire une seule fois, depuis ce dossier :
#   1.  npx wrangler d1 create marlowe
#   2.  recopier le database_id renvoyé ci-dessous
#   3.  npx wrangler d1 execute marlowe --remote --file=schema.sql
#   4.  npx wrangler deploy
#
# Les anciennes données remontent toutes seules de KV à la première ouverture
# du panel : il n'y a aucun script de migration à jouer.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "marlowe"
database_id = "ab8f440c-bb1e-440d-b09b-b08c29cd4a6a"

# ---------------------------------------------------------------------------
# Stockage des images et des PDF : KV, et rien d'autre.
#
# Une image s'écrit trois fois par mois et pèse plusieurs centaines de kilos :
# le quota d'écritures ne la gêne pas, et D1 plafonne à 2 Mo par ligne. Elle
# reste donc ici, servie directement depuis le réseau Cloudflare.
#
# C'est le MÊME espace qu'avant — l'identifiant n'a pas changé, seul le nom du
# raccordement passe de MARLOWE à IMAGES. Les anciennes données y sont encore,
# et c'est de là que le Worker les récupère au premier démarrage.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "IMAGES"
id = "96dc213dcafc411d8417448b46fc9274"

# ---------------------------------------------------------------------------
# Les SECRETS ne se mettent JAMAIS dans ce fichier.
# Ils se posent en ligne de commande :
#   npx wrangler secret put DISCORD_CLIENT_SECRET
#   npx wrangler secret put DISCORD_BOT_TOKEN
#   npx wrangler secret put DISCORD_CLIENT_ID
#   npx wrangler secret put DISCORD_WEBHOOK
#
# Le rappel d'agenda n'a besoin d'AUCUN secret : il passe par le bot, dont le
# jeton est déjà posé, et le salon se déclare en clair plus haut.
#
# DISCORD_WEBHOOK = l'adresse du webhook du salon des runners.
#   Discord ▸ le salon ▸ Modifier le salon ▸ Intégrations ▸ Webhooks ▸
#   Nouveau webhook ▸ Copier l'URL.
#   C'est une autorisation d'écrire dans le salon : elle ne doit jamais
#   se retrouver dans le code du site.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Le passage périodique qui lit les logs de vente.
#
# Toutes les deux minutes : assez pour que le tableau soit « en direct » sans
# que personne n'ait à rafraîchir, et très loin des limites de Discord comme
# de celles de Cloudflare.
#
# Rien à craindre d'un passage qui se répète ou qui rattrape du retard : la
# clé primaire de la table ventes est l'identifiant du message Discord, donc
# une vente déjà comptée est ignorée.
# ---------------------------------------------------------------------------
[triggers]
crons = ["*/2 * * * *"]
