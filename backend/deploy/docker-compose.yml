# backend/deploy/docker-compose.yml
# Lancer depuis /opt/marlowe :  sudo docker compose -f backend/deploy/docker-compose.yml up -d --build
#
# ⚠️ CE FICHIER SUPPOSE UN VPS PRÉCIS — celui où tournent déjà plusieurs
# projets derrière un même Caddy partagé (voir le réseau `caddy` tout en bas,
# externe, nommé vps_default). Sur un VPS neuf ou différent, `docker compose
# up` échouera à ce réseau externe introuvable : retirez le bloc `caddy` des
# deux endroits (le service marlowe-app et la section `networks`), et
# utilisez plutôt un reverse proxy classique devant le port 8787 exposé par
# le conteneur — ou suivez la voie sans Docker du README.md, sections 1 à 4,
# qui ne suppose rien de l'hébergeur.
#
# UNE INSTANCE SUFFIT — PLUSIEURS SONT POSSIBLES DEPUIS LA 1.48.0
# ----------------------------------------------------------------------------
# Avant, il ne fallait JAMAIS lancer ce service en plusieurs exemplaires : ce
# qui empêchait deux enregistrements simultanés de s'écraser était une file
# d'attente en mémoire, propre à chaque processus, et deux conteneurs
# perdaient des données en silence.
#
# Depuis la 1.48.0, l'arbitrage est tenu par la base elle-même (un verrou
# nommé GET_LOCK, voir src/db.js) : il vaut pour tous les conteneurs branchés
# sur la même base. Un « --scale marlowe-app=2 » ou un « replicas: » ne perd
# donc plus rien — à condition que toutes les instances pointent sur le MÊME
# marlowe-db. Ce qu'il faut savoir avant d'en lancer plusieurs :
# backend/README.md, « Plusieurs instances ».
#
# Même montage que les projets voisins sur ce VPS (maja13, entre autres) :
# une image pour l'app (site + API, voir backend/Dockerfile), une base
# dédiée dans son propre conteneur, un réseau externe partagé avec le Caddy
# de Dynasty 8 pour que le reverse proxy puisse joindre l'app par son nom.
name: marlowe
services:
  # nom explicite : le réseau vps_default est partagé avec Dynasty 8, dont
  # le service s'appelle déjà "app"
  marlowe-app:
    container_name: marlowe-app-1
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Valeurs d'infrastructure, fixes une fois pour toutes : le nom du
      # service Docker fait office d'adresse réseau. Le mot de passe, lui,
      # vient de ../.env (DB_PASSWORD), jamais d'ici.
      DB_HOST: marlowe-db
      DB_PORT: "3306"
      DB_NAME: marlowe
      DB_USER: marlowe
      # Obligatoire dans un conteneur : le proxy arrive par le réseau Docker,
      # pas par 127.0.0.1. Prime sur un HOST laissé dans ../.env.
      HOST: "0.0.0.0"
    # Sans le Caddy partagé (VPS différent) : publiez le port sur la machine,
    # EN LOCAL SEULEMENT, et mettez votre propre reverse proxy devant.
    # Le premier nombre est le port côté machine, le second celui de PORT.
    # ports:
    #   - "127.0.0.1:8787:8787"
    depends_on:
      marlowe-db:
        condition: service_healthy
    networks:
      - default
      - caddy       # réseau du Caddy partagé du VPS, pour le reverse proxy
  marlowe-db:
    container_name: marlowe-db-1
    image: mariadb:10.11
    restart: unless-stopped
    env_file: ../.env          # fournit MARIADB_PASSWORD (= DB_PASSWORD)
    environment:
      MARIADB_DATABASE: marlowe
      MARIADB_USER: marlowe
      # L'app se connecte avec le compte marlowe ci-dessus, jamais en root.
      # Créé par l'image avec tous les droits sur la base marlowe — il lui
      # faut CREATE, le schéma s'applique au démarrage (voir ../README.md,
      # §2). Un mot de passe root aléatoire, jamais affiché ni conservé,
      # suffit donc.
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - marlowe-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  marlowe-db:
networks:
  caddy:
    external: true
    name: vps_default     # réseau du compose Dynasty 8 (là où vit le Caddy partagé)
