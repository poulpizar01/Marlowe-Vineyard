# backend/deploy/docker-compose.yml
# Lancer depuis le dossier du dépôt :
#     sudo docker compose -f backend/deploy/docker-compose.yml up -d --build
#
# Deux conteneurs : l'app (site + API, voir backend/Dockerfile) et sa base
# MariaDB, chacun dans sa boîte. Le port de l'API n'est publié que sur
# 127.0.0.1 de la machine : c'est votre reverse proxy (Caddy, nginx…) qui
# porte le HTTPS devant — voir deploy/Caddyfile.snippet et backend/README.md §4.
#
# UNE INSTANCE SUFFIT — PLUSIEURS SONT POSSIBLES DEPUIS LA 1.48.0
# ----------------------------------------------------------------------------
# Avant, il ne fallait JAMAIS lancer ce service en plusieurs exemplaires : ce
# qui empêchait deux enregistrements simultanés de s'écraser était une file
# d'attente en mémoire, propre à chaque processus, et deux conteneurs
# perdaient des données en silence.
#
# Depuis la 1.48.0, l'arbitrage est tenu par la base elle-même (un verrou
# nommé GET_LOCK, voir src/db.js) : il vaut pour tous les conteneurs branchés
# sur la même base. Un « --scale marlowe-app=2 » ou un « replicas: » ne perd
# donc plus rien — à condition que toutes les instances pointent sur le MÊME
# marlowe-db. (Avec « ports: » publié ci-dessous, une seule instance peut
# prendre le port : pour en lancer plusieurs, retirez « ports: » et faites
# joindre les conteneurs par leur nom depuis un proxy sur le réseau Docker.)
# Ce qu'il faut savoir avant d'en lancer plusieurs : backend/README.md,
# « Plusieurs instances ».
name: marlowe
services:
  marlowe-app:
    container_name: marlowe-app-1
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Valeurs d'infrastructure, fixes une fois pour toutes : le nom du
      # service Docker fait office d'adresse réseau. Le mot de passe, lui,
      # vient de ../.env (DB_PASSWORD), jamais d'ici.
      DB_HOST: marlowe-db
      DB_PORT: "3306"
      DB_NAME: marlowe
      DB_USER: marlowe
      # Dans le conteneur, l'API écoute toujours sur 8787 et sur toutes les
      # interfaces du conteneur : le proxy y arrive par le réseau Docker, pas
      # par 127.0.0.1. Ces deux valeurs priment sur PORT/HOST laissés dans
      # ../.env — le port côté MACHINE se choisit dans « ports: » ci-dessous.
      PORT: "8787"
      HOST: "0.0.0.0"
    ports:
      # <port sur la machine>:<port dans le conteneur>. Publié sur 127.0.0.1
      # SEULEMENT : l'API n'est jamais joignable depuis Internet sans passer
      # par votre reverse proxy. Changez le premier nombre si 8787 est pris.
      - "127.0.0.1:8787:8787"
    depends_on:
      marlowe-db:
        condition: service_healthy
  marlowe-db:
    container_name: marlowe-db-1
    image: mariadb:10.11
    restart: unless-stopped
    env_file: ../.env          # fournit MARIADB_PASSWORD (= DB_PASSWORD)
    environment:
      MARIADB_DATABASE: marlowe
      MARIADB_USER: marlowe
      # L'app se connecte avec le compte ci-dessus (tous droits sur la base
      # marlowe, ce qu'il lui faut pour créer ses tables au démarrage), jamais
      # en root. Un mot de passe root aléatoire, jamais affiché ni conservé,
      # suffit donc.
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - marlowe-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  marlowe-db:
